# https://prettier.io/docs/en/configuration.html

printWidth: 100
tabWidth: 2
useTabs: false
semi: true
singleQuote: false
trailingComma: es5
bracketSpacing: true
bracketSameLine: false
arrowParens: always
proseWrap: preserve
endOfLine: lf
overrides:
  - files:
      - '*.json'
    options:
      tabWidth: 2
  - files:
      - '*.md'
    options:
      proseWrap: always
      printWidth: 80
  - files:
      - '*.yml'
      - '*.yaml'
    options:
      tabWidth: 2
  - files:
      - '*.tsx'
    options:
      parser: typescript
