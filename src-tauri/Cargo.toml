[package]
name = "linuxy"
version = "2.0.2"
description = "A centralized application manager for Linux, Windows, and macOS"
authors = ["Swadhin Biswas <swadhinbiswas.cse@gmail.com>"]
license = "MIT"
repository = "https://github.com/swadhinbiswas/linuxy"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-os = "2.0"
tauri-plugin-process = "2.0"
tauri-plugin-log = "2.0"
tauri-plugin-autostart = "2.0"
tauri-plugin-single-instance = "2.0"
tauri-plugin-deep-link = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-cli = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-window-state = "2.0"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
reqwest = { version = "0.12", features = ["stream", "rustls-tls"], default-features = false }
futures-util = "0.3"
log = "0.4"
anyhow = "1"
thiserror = "1"
once_cell = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
filetime = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winuser", "shellapi", "handleapi"] }
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_Com"] }

[features]
default = []
