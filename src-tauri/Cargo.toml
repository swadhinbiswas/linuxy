[package]
name = "linuxy"
version = "1.0.0"
description = "A centralized AppImage manager and installer for Linux"
authors = ["Linuxy Contributors"]
license = "MIT"
repository = "https://github.com/swadhinbiswas/linuxy"
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "1.5.1", features = [] }

[dependencies]
tauri = { version = "1.5.2", features = ["custom-protocol", "protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.4", features = ["v4"] }
dirs = "5.0"
reqwest = { version = "0.13", features = ["stream"] }
futures-util = "0.3"
