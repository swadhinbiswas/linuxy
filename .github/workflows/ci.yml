name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Frontend checks
  frontend-lint:
    name: Frontend Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run frontend checks
        run: npm run typecheck && npm run format:check && npx eslint src --ext ts,tsx --report-unused-disable-directives --max-warnings 0

      - name: Build frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Rust backend checks
  rust-check:
    name: Rust Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Run Clippy linter
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --all

      - name: Check Rust code
        working-directory: src-tauri
        run: cargo check --all-targets

  # Build Tauri application
  build-tauri:
    name: Build Tauri App
    runs-on: ubuntu-latest
    needs: [frontend-lint, rust-check, verify-csp]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Install Rust dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Linuxy v__VERSION__"
          releaseBody: |
            ## Changes
            See the [changelog](https://github.com/swadhinbiswas/linuxy/blob/main/CHANGELOG.md) for details.
          releaseDraft: true
          prerelease: false
          includeDebug: false

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: linuxy-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 7

  # Security audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-action@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        working-directory: src-tauri
        run: cargo audit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

  # Production CSP verification
  verify-csp:
    name: Verify CSP Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify CSP allows required domains
        run: |
          CSP=$(grep -o '"csp": *"[^"]*"' src-tauri/tauri.conf.json | sed 's/"csp": "//' | sed 's/"//')
          echo "Checking CSP: $CSP"

          # Check required domains are allowed
          if ! echo "$CSP" | grep -q "appimage.github.io"; then
            echo "ERROR: appimage.github.io not in CSP"
            exit 1
          fi
          if ! echo "$CSP" | grep -q "api.github.com"; then
            echo "ERROR: api.github.com not in CSP"
            exit 1
          fi
          if ! echo "$CSP" | grep -q "avatars.githubusercontent.com"; then
            echo "ERROR: avatars.githubusercontent.com not in CSP"
            exit 1
          fi

          echo "CSP verification passed!"

  # Integration tests on clean environment
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-action@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            firejail

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Test binary exists
        run: |
          echo "Verifying binary..."
          ls -la src-tauri/target/release/linuxy
          file src-tauri/target/release/linuxy

      - name: Verify bundle outputs
        run: |
          echo "Checking bundle outputs..."
          ls -la src-tauri/target/release/bundle/
          [ -d "src-tauri/target/release/bundle/deb" ] && echo "DEB: OK"
          [ -d "src-tauri/target/release/bundle/appimage" ] && echo "AppImage: OK"
          [ -d "src-tauri/target/release/bundle/rpm" ] && echo "RPM: OK"

      - name: Verify desktop file template
        run: |
          if [ -f "src-tauri/debian/desktop-template.desktop" ]; then
            echo "Desktop template: OK"
          else
            echo "ERROR: Desktop template not found"
            exit 1
          fi
