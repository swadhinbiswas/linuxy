name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release Assets
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libsoup2.4-dev \
            libjavascriptcoregtk-4.0-dev \
            libgdk-pixbuf-2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libcairo2-dev

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Linuxy ${{ github.ref_name }}"
          releaseBody: |
            ## 🚀 What's Changed

            Please see the changelog for detailed information.

            ## 📦 Installation

            ### Debian/Ubuntu
            ```bash
            sudo apt install ./linuxy_*.deb
            ```

            ### Arch Linux (AUR)
            ```bash
            yay -S linuxy
            ```

            ## 🙏 Thanks
            Thanks to everyone who contributed to this release!
          releaseDraft: true
          prerelease: false
          includeDebug: false

      - name: Extract version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Upload DEB to release
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/release/bundle/deb/*.deb
          draft: true

      - name: Upload AppImage to release
        uses: softprops/action-gh-release@v1
        if: hashFiles('src-tauri/target/release/bundle/appimage/*.AppImage') != ''
        with:
          files: src-tauri/target/release/bundle/appimage/*.AppImage
          draft: true

      - name: Upload RPM to release
        uses: softprops/action-gh-release@v1
        if: hashFiles('src-tauri/target/release/bundle/rpm/*.rpm') != ''
        with:
          files: src-tauri/target/release/bundle/rpm/*.rpm
          draft: true

  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: build-release

    steps:
      - name: Create release notification
        run: |
          echo "✅ Release ${{ github.ref_name }} has been published!"
          echo "📦 Assets are being built and will be available shortly."
          echo "🔗 View release: https://github.com/swadhinbiswas/linuxy/releases/tag/${{ github.ref_name }}"
