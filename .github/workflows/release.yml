name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release Assets
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libsoup2.4-dev \
            libjavascriptcoregtk-4.0-dev \
            libgdk-pixbuf-2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libcairo2-dev

      - name: Install npm dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Linuxy ${{ github.ref_name }}"
          releaseBody: |
            ## 🚀 What's Changed

            Please see the changelog for detailed information.

            ## 📦 Installation

            ### Debian/Ubuntu
            ```bash
            sudo apt install ./linuxy_*.deb
            ```

            ### RHEL/Fedora/OpenSUSE
            ```bash
            sudo dnf install ./linuxy-*.rpm
            ```

            ### Arch Linux (AUR)
            ```bash
            yay -S linuxy
            ```

            ## 🙏 Thanks
            Thanks to everyone who contributed to this release!
          releaseDraft: false
          prerelease: false
          includeDebug: false

      - name: Install Ruby and fpm for RPM conversion
        run: |
          sudo apt-get install -y ruby ruby-dev rpm
          sudo gem install --no-document fpm
          # Ensure system gems are in PATH (fixes user gem path precedence issue)
          export PATH="$(gem env | grep 'EXECUTABLE DIRECTORY' | awk '{print $4}'):$PATH"
          fpm --version

      - name: Build RPM package
        run: |
          export PATH="$(gem env | grep 'EXECUTABLE DIRECTORY' | awk '{print $4}'):$PATH"
          ./scripts/build-rpm.sh

      - name: Extract version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Upload DEB to release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: src-tauri/target/release/bundle/deb/*.deb
          draft: true

      - name: Upload RPM to release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: hashFiles('src-tauri/target/release/bundle/rpm/*.rpm') != ''
        with:
          files: src-tauri/target/release/bundle/rpm/*.rpm
          draft: true

  publish-aur:
    name: Publish AUR Package
    runs-on: ubuntu-latest
    needs: build-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update PKGBUILD and .SRCINFO
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          sed -i "s/pkgver=.*/pkgver=${VERSION}/" packaging/aur/PKGBUILD
          sed -i "s/pkgver = .*/pkgver = ${VERSION}/" packaging/aur/.SRCINFO
          sed -i "s|source = linuxy-.*|source = linuxy-${VERSION}.tar.gz::https://github.com/swadhinbiswas/linuxy/archive/refs/tags/v${VERSION}.tar.gz|" packaging/aur/.SRCINFO
          # Download source and compute checksum
          curl -sL "https://github.com/swadhinbiswas/linuxy/archive/refs/tags/v${VERSION}.tar.gz" -o /tmp/linuxy-${VERSION}.tar.gz
          CHECKSUM=$(sha256sum /tmp/linuxy-${VERSION}.tar.gz | awk '{print $1}')
          sed -i "s/sha256sums=.*/sha256sums=('${CHECKSUM}')/" packaging/aur/PKGBUILD
          sed -i "s/sha256sums = .*/sha256sums = ${CHECKSUM}/" packaging/aur/.SRCINFO

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v2.7.1
        with:
          pkgname: linuxy
          pkgbuild: packaging/aur/PKGBUILD
          assets: |
            packaging/aur/.SRCINFO
            packaging/aur/linuxy.install
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "chore: update to version ${{ steps.get_version.outputs.VERSION }}"
          ssh_keyscan_types: rsa,ed25519

  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: build-release

    steps:
      - name: Create release notification
        run: |
          echo "✅ Release ${{ github.ref_name }} has been published!"
          echo "📦 Assets are being built and will be available shortly."
          echo "🔗 View release: https://github.com/swadhinbiswas/linuxy/releases/tag/${{ github.ref_name }}"
