app-id: com.linuxy.App
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.freedesktop.Sdk
sdk-version: "25.08"
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
command: linuxy
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=home
  - --filesystem=xdg-run/dconf
  - --filesystem=~/.config/dconf:ro
  - --talk-name=ca.desrt.dconf
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.FileChooser
  - --system-talk-name=org.freedesktop.PackageKit
build-options:
  append-path: /usr/lib/sdk/node22/bin
  env:
    NPM_CONFIG_CACHE: /run/build/linuxy/npm-cache

modules:
  - name: linuxy
    buildsystem: simple
    build-commands:
      - |
        # Setup cargo vendor directory
        mkdir -p src-tauri/cargo
        cp cargo-sources.json src-tauri/cargo-sources.json
        mkdir -p src-tauri/cargo/vendor

        # Download and extract all cargo dependencies
        cd src-tauri
        for entry in $(python3 -c "
import json
with open('cargo-sources.json') as f:
    sources = json.load(f)
for s in sources:
    print(f\"{s['url']}|{s['sha256']}\")
        "); do
          url=$(echo "$entry" | cut -d'|' -f1)
          sha=$(echo "$entry" | cut -d'|' -f2)
          crate_name=$(basename "$url" .crate)
          mkdir -p "cargo/vendor/$crate_name"
          curl -fsSL "$url" -o "/tmp/$crate_name.crate"
          echo "$sha  /tmp/$crate_name.crate" | sha256sum -c -
          tar xzf "/tmp/$crate_name.crate" -C "cargo/vendor/$crate_name" --strip-components=1
          rm "/tmp/$crate_name.crate"
        done

        # Create cargo config to use vendored sources
        mkdir -p .cargo
        cat > .cargo/config.toml << 'CARGOEOF'
        [source.crates-io]
        replace-with = "vendored-sources"

        [source.vendored-sources]
        directory = "cargo/vendor"
        CARGOEOF

        # Build the frontend
        npm install
        npm run build

        # Build the Rust backend
        cd src-tauri
        cargo build --offline --release

        # Install the binary
        install -Dm755 target/release/linuxy /app/bin/linuxy

        # Install desktop file
        install -Dm644 ../flatpak/com.linuxy.App.desktop /app/share/applications/com.linuxy.App.desktop

        # Install metainfo
        install -Dm644 ../flatpak/com.linuxy.App.metainfo.xml /app/share/metainfo/com.linuxy.App.metainfo.xml

        # Install icons
        install -Dm644 icons/32x32.png /app/share/icons/hicolor/32x32/apps/com.linuxy.App.png
        install -Dm644 icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.linuxy.App.png
        install -Dm644 icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/com.linuxy.App.png
        install -Dm644 icons/icon.png /app/share/icons/hicolor/512x512/apps/com.linuxy.App.png
    sources:
      - type: dir
        path: ..
        skip:
          - node_modules
          - dist
          - src-tauri/target
          - src-tauri/cargo
          - src-tauri/.cargo
          - flatpak
          - snap
          - web
          - .git
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/cmake
      - /share/man
      - /share/doc
      - "*.la"
      - "*.a"
